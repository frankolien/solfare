include: package:flutter_lints/flutter.yaml

# Every rule below was added because it catches something that was actually
# wrong in this codebase, not because it appeared on a list. The comment on
# each says what it caught.
analyzer:
  exclude:
    # Generated. They carry their own ignore_for_file, but excluding them
    # keeps `--fatal-infos` honest.
    - lib/l10n/**
  errors:
    # This was already on and reported 13 times, and blocked nothing — so the
    # warnings sat in the build output permanently and got tuned out. Most of
    # them guard State.mounted while holding a different element's context,
    # which is a guard the analyzer cannot verify and a bug it cannot see.
    use_build_context_synchronously: error
    # Failures nobody can observe: WidgetBridge.pushPrice, launchUrl,
    # setLocale. A discarded future means a silent no-op in release.
    unawaited_futures: error
    # core/error/failures.dart throws Failure, which extends neither Exception
    # nor Error and is caught by type nowhere in the app.
    only_throw_errors: error

linter:
  rules:
    # A wallet parsing untrusted on-chain JSON through `dynamic`. Every one of
    # these is a NoSuchMethodError waiting on a schema change, and the audit
    # found those crashes being swallowed into `return []`.
    - avoid_dynamic_calls
    # `void f() async` means no caller can await it or see it throw.
    # stake_account_detail_screen's explorer launch was one, and its catch (_)
    # ate the failure with nothing to show for it.
    - avoid_void_async
    # Ratchets. All currently clean; enabled so they stay that way.
    - avoid_empty_else
    - collection_methods_unrelated_type
    - literal_only_boolean_expressions
    - throw_in_finally
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - unawaited_futures
    - only_throw_errors
